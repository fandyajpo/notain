# Render Blueprint for the mailer.
#
# The site itself is on Cloudflare Pages; this file describes the one process
# Cloudflare cannot be — the Node service in `mailer/` that talks to the SMTP
# relay through `@sendust/ts`, which is a native addon and cannot run in a
# Worker.
#
# To use it: render.com → New → Blueprint → pick this repository → Apply.
# Render then asks for the three SMTP values and generates the service token.
# Nothing secret is stored in this file.

services:
  - type: web
    name: notain-mailer
    runtime: docker
    dockerfilePath: ./mailer/Dockerfile
    dockerContext: ./mailer
    plan: free
    # Answers without touching the relay, so a health check never spends an
    # SMTP login.
    healthCheckPath: /healthz
    envVars:
      # `sync: false` means "ask me at deploy time" instead of committing a
      # value. For Gmail: the address, its 16-character App Password, and the
      # same address again as the sender.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Generated by Render. Copy it into the Cloudflare Pages variable of the
      # same name — the two must match exactly, or every send answers 401.
      - key: MAIL_SERVICE_TOKEN
        generateValue: true
      - key: MAIL_APP_NAME
        value: Notain
