# Cloudflare Worker + Container that runs `@sendust/ts` for Notain.
#
# Deployed separately from the Pages project (which reads the `wrangler.toml` at
# the repository root). `npx wrangler deploy` from this folder builds the image
# from `./Dockerfile`, pushes it to Cloudflare's registry, and ships the Worker.
#
# Requires the Workers PAID plan: Containers are not available on Free.
#
# Secrets are NOT listed here. Set them once with
#   npx wrangler secret bulk secrets.json
# or let .github/workflows/deploy.yml do it from repository secrets:
#   SMTP_USER, SMTP_PASS, MAIL_FROM, MAIL_SERVICE_TOKEN

name = "notain-mailer"
main = "worker.mjs"
compatibility_date = "2026-11-22"

[[containers]]
class_name = "MailerContainer"
# The Durable Object picks the image and instance type each time it starts one.
scheduling_policy = "durable_object"

[containers.images.base]
dockerfile = "./Dockerfile"

[[durable_objects.bindings]]
name = "MAILER"
class_name = "MailerContainer"

[exports.MailerContainer]
type = "durable-object"
storage = "sqlite"

# Non-secret configuration only. `MAIL_FROM` may live here if you prefer it
# visible; it is an address, not a credential.
[vars]
MAIL_APP_NAME = "Notain"

[observability]
enabled = true
