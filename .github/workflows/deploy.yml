# Build the Astro site, then push the static output *and* the Pages Functions
# (`functions/`) to Cloudflare with Wrangler. A push to `main` is the only
# trigger you need — no manual `wrangler pages deploy` anymore.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN     Custom token with "Cloudflare Pages: Edit" and
#                            "Workers R2 Storage: Edit" on your account.
#   CLOUDFLARE_ACCOUNT_ID    Your account ID, taken from the dashboard URL
#                            (dash.cloudflare.com/<ACCOUNT_ID>/...). Not a
#                            credential — kept in a secret only to keep the
#                            number of places that know it down to one.
#   PUBLIC_TURNSTILE_SITE_KEY  Cloudflare Turnstile sitekey, baked into the
#                            build as PUBLIC_TURNSTILE_SITE_KEY. Public by
#                            design (it ships to the browser), but kept out of
#                            the repo so the source carries no keys at all.
#                            The build fails without it rather than shipping
#                            a site whose bot gate silently went missing.
#
# Optional repository secret — email only, and only after the mailer function
# exists (an Appwrite Function; see docs/features/email.md). The function's
# domain already lives in `wrangler.toml` [vars], so only the token travels:
#   MAIL_SERVICE_TOKEN       The shared token set on the function as a variable.
# Unset means every /api/mail/* route answers 503 and the rest of the site is
# untouched.
#
# Cloudflare auto-build must be OFF for this project, otherwise Cloudflare
# builds on every push as well and the two deploys overwrite each other:
#   Workers & Pages → notain → Builds → Branch control →
#   "Enable automatic production branch deployments" = off.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race each other: keep the newest run and queue the rest.
concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    # The `lint` job has been green on `main`, so the tree it checks is the
    # tree this job ships: a lint error now stops a deploy instead of only
    # showing on the run.
    needs: lint
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      # Fail with a readable message instead of a cryptic Wrangler 403/404
      # when a secret has not been added yet.
      - name: Check Cloudflare credentials
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$PUBLIC_TURNSTILE_SITE_KEY" ] && missing="$missing PUBLIC_TURNSTILE_SITE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Formatting is APPLIED, not enforced. A push must never fail because the
      # formatter would rewrap a line, so this step rewrites the tree and the
      # build uses the result. Drift is still visible: the notice names how many
      # files were rewritten, so nobody is surprised later.
      - name: Format
        run: |
          npm run format
          changed=$(git status --porcelain | wc -l | tr -d ' ')
          if [ "$changed" -gt 0 ]; then
            echo "::warning::$changed file(s) were reformatted by CI — run `npm run format` before pushing."
          fi

      # Nothing ships that fails its own suite: tests and type check used to
      # run only on a developer machine, so a red suite could still deploy.
      # CI has no `.env`, so this also proves the suite passes on the config
      # defaults alone — the same values production falls back to.
      - name: Test
        run: npm test

      # `mailer/` is its own package, so the root Vitest include (`src/**`,
      # `tests/**`) never sees these files and they used to run nowhere. No
      # `npm install` is needed in `mailer/`: the tests import only the
      # configuration, the message builders and the request validator, never
      # the native addon, so this stays offline and fast.
      - name: Test (mailer)
        run: npm run test:mailer

      - name: Type check
        run: npm run typecheck

      # `.env` is intentionally absent in CI: the build falls back to the
      # defaults in `src/appwrite/config.ts`, which already match production.
      # `.env` only feeds Vite; the Function reads `wrangler.toml` instead.
      - name: Build
        run: npm run build

      # --- Email -------------------------------------------------------------
      # The mailer runs as an Appwrite Function (`mailer/src/appwrite.mjs`), not
      # on Cloudflare: its `@sendust/ts` dependency is a native Node-API addon
      # and no Worker can load one. Appwrite deploys that function from this
      # repository by itself, and its domain is already in `wrangler.toml`
      # [vars] as `MAIL_SERVICE_URL`, so only the token needs carrying. It must
      # match the function's own `MAIL_SERVICE_TOKEN` variable exactly.
      #
      # Written BEFORE the deploy, because a Pages deployment binds the
      # variables that exist when it is built. Optional: unset means every
      # /api/mail/* route answers 503 and the rest of the site is untouched.
      - name: Connect Pages to the mailer
        continue-on-error: true
        env:
          MAIL_SERVICE_TOKEN: ${{ secrets.MAIL_SERVICE_TOKEN }}
        run: |
          if [ -z "$MAIL_SERVICE_TOKEN" ]; then
            echo "::notice::MAIL_SERVICE_TOKEN is not set — email stays off."
            exit 0
          fi
          printf '%s' "$MAIL_SERVICE_TOKEN" |
            npx wrangler pages secret put MAIL_SERVICE_TOKEN --project-name notain

      - name: Deploy
        # `dist/` = static assets, `functions/` = Pages Functions. Both are
        # read from the repo root; `wrangler.toml` supplies [vars] + R2 binding.
        run: npm run deploy -- --branch main

  # `npm run lint` used to run only on a developer machine, so a lint error —
  # the config makes `any`, `@ts-ignore`, unsafe optional chaining and unused
  # variables errors — could reach `main` unseen while tests and typechecking
  # stayed green. It runs as its own job, in parallel with the deploy: a finding
  # shows on the run without being able to stop a deploy by itself until it has
  # proven green here (then it becomes a `needs:` of `deploy`).
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      # `astro sync` below loads `astro.config.mjs`, which needs the sitekey for
      # the same reason the build does.
      PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Type-aware rules read the project through `tsconfig.json`, which includes
      # `.astro/types.d.ts` — generated, not committed.
      - name: Generate Astro types
        run: npx astro sync

      - name: Lint
        run: npm run lint
